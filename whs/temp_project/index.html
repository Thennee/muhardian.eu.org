<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QR Scanner System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- HTML5-QRCode untuk Fitur Scan Barcode/QR Code -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --primary-red: #dc2626;
      --dark-red: #991b1b;
      --light-red: #fef2f2;
      --bg-light: #fff5f5;
      --text-main: #1e293b;
      --card-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.1), 0 8px 10px -6px rgba(220, 38, 38, 0.05);
      --app-max-width: 500px; 
      --header-height: 90px;
      --nav-height: 75px;
      --safe-area-bottom: env(safe-area-inset-bottom);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #fecaca; 
      color: var(--text-main); 
      margin: 0; padding: 0;
      overflow: hidden; 
      position: fixed; 
      width: 100%; height: 100%;
      -webkit-font-smoothing: antialiased;
    }

    #loginPage, #mainApp { 
      max-width: var(--app-max-width); 
      margin: 0 auto; 
      background-color: var(--bg-light);
      height: 100dvh;
      width: 100%;
      box-shadow: 0 0 100px rgba(153, 27, 27, 0.2);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #loginPage { background: linear-gradient(135deg, var(--dark-red) 0%, var(--primary-red) 100%); justify-content: center; padding: 20px; z-index: 5; }
    .login-card { background: white; border-radius: 40px; padding: 45px 35px; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }

    .header-section { 
      position: absolute; top: 0; left: 0; width: 100%; height: var(--header-height);
      padding: 20px 25px; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px); border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; 
      box-shadow: 0 4px 20px rgba(220, 38, 38, 0.08); z-index: 1010; display: flex; flex-direction: column; justify-content: center; 
    }
    .btn-header-action { background: #fee2e2; border: none; color: var(--dark-red); width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .btn-header-action:active { transform: scale(0.9); background: #fca5a5; }

    .scrollable-content {
      flex: 1; overflow-y: auto; padding: 20px 25px;
      padding-top: calc(var(--header-height) + 20px); 
      padding-bottom: calc(var(--nav-height) + var(--safe-area-bottom) + 20px); 
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      z-index: 1;
    }
    .scrollable-content::-webkit-scrollbar { display: none; }

    .menu-card {
      background: white;
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(220, 38, 38, 0.1);
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .menu-card:active { transform: scale(0.97); background: var(--light-red); }

    .menu-icon-box {
      width: 60px; height: 60px;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    .bg-soft-red { background: #fee2e2; color: var(--dark-red); }

    .bottom-nav { 
      position: absolute; bottom: 0; left: 0; width: 100%; height: calc(var(--nav-height) + var(--safe-area-bottom)); 
      background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
      display: flex; align-items: center; justify-content: space-around; 
      border-top: 1px solid rgba(220, 38, 38, 0.1); z-index: 1010; padding-bottom: var(--safe-area-bottom); 
      border-radius: 35px 35px 0 0;
    }
    .nav-item-custom { display: flex; flex-direction: column; align-items: center; color: #cbd5e1; text-decoration: none; font-size: 0.75rem; font-weight: 800; transition: 0.2s; padding: 10px; }
    .nav-item-custom.active { color: var(--primary-red); }
    .nav-item-custom i { font-size: 1.5rem; margin-bottom: 2px; }

    .modal-dialog { position: fixed !important; bottom: 0 !important; margin: 0 !important; width: 100% !important; max-width: var(--app-max-width) !important; left: 50% !important; transform: translateX(-50%) !important; z-index: 5001; }
    .modal-content { border-radius: 40px 40px 0 0 !important; border: none; padding-bottom: calc(20px + var(--safe-area-bottom)); max-height: 92dvh; overflow-y: auto; scrollbar-width: none; box-shadow: 0 -15px 50px rgba(153, 27, 27, 0.15); }
    .modal-handle { width: 50px; height: 6px; background: #e2e8f0; border-radius: 10px; margin: 15px auto 25px; flex-shrink: 0; }
    
    .form-control { border-radius: 20px; border: 2px solid #f1f5f9; padding: 15px 20px; font-size: 1rem; background-color: #f8fafc; font-weight: 500; }
    .form-control:focus { border-color: var(--primary-red); background-color: #fff; box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.1); }
    .form-control[readonly] { background-color: #fee2e2; cursor: not-allowed; border-color: #fca5a5; }

    #fullPageLoader { display:none; position:fixed; inset:0; background:rgba(255,255,255,0.95); z-index: 9999; justify-content:center; align-items:center; flex-direction:column; backdrop-filter: blur(10px); }
    #reader { width: 100%; border-radius: 20px; overflow: hidden; background: #000; }
    .login-logo { width: 110px; height: 110px; object-fit: contain; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div id="fullPageLoader">
    <div class="spinner-border text-danger" role="status"></div>
    <p class="mt-3 fw-bold small text-danger text-uppercase" style="letter-spacing: 1px;">Memproses Data...</p>
  </div>

  <!-- HALAMAN LOGIN -->
  <div id="loginPage">
    <div class="login-card text-center">
      <img src="https://muhardian.eu.org/whs/sf_logo.png" alt="Logo System" class="login-logo mx-auto d-block" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6831/6831000.png'">
      <h3 class="fw-800 mb-1" style="letter-spacing: -1.5px; font-weight: 800; color: var(--dark-red);">SCANNER SYSTEM</h3>
      <p class="text-muted small mb-4">Masuk untuk Memulai Scan</p>
      <input type="text" id="username" class="form-control mb-3" placeholder="Username">
      <input type="password" id="password" class="form-control mb-4" placeholder="Password">
      <button class="btn btn-danger w-100 rounded-pill py-3 fw-bold shadow-lg" 
              style="background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%); border: none; font-size: 1.1rem;"
              onclick="handleLogin()">Masuk Aplikasi</button>
      
      <!-- FOOTER COPYRIGHT LOGIN -->
      <div class="mt-4 pt-1">
        <a href="https://muhardian.eu.org" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-muted small fw-semibold" style="font-size: 0.75rem;">
          &copy; 2026
        </a>
      </div>
    </div>
  </div>

  <!-- APLIKASI UTAMA -->
  <div id="mainApp" class="d-none">
    <div class="header-section">
      <div class="d-flex justify-content-between align-items-center">
        <div class="ps-1">
          <h2 class="fw-bold m-0" id="currentTitle" style="font-size: 1.5rem; letter-spacing: -0.8px; color: var(--dark-red);">Menu Scanner</h2>
          <div class="d-flex align-items-center gap-2 mt-1">
            <div style="width: 8px; height: 8px; background: var(--primary-red); border-radius: 50%; box-shadow: 0 0 10px var(--primary-red);"></div>
            <p class="text-muted small fw-bold text-uppercase m-0" id="userGreeting" style="font-size: 0.65rem; letter-spacing: 0.8px;">OPERATOR : ADMIN</p>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn-header-action shadow-sm" onclick="logout()" title="Keluar"><i class="fa-solid fa-power-off"></i></button>
        </div>
      </div>
    </div>

    <div class="scrollable-content" id="appContentArea">
      <!-- DASHBOARD MENU UTAMA -->
      <div id="page-home">
        <p class="text-muted small fw-bold mb-3 uppercase" style="letter-spacing: 0.5px;">PILIH FITUR</p>
        
        <!-- MENU SCANNER -->
        <div class="menu-card" onclick="openScannerModal()">
          <div class="menu-icon-box bg-soft-red">
            <i class="fa-solid fa-qrcode"></i>
          </div>
          <div>
            <h5 class="fw-bold m-0 text-dark">SCANNER</h5>
            <small class="text-muted">Proses Scan QR / Barcode</small>
          </div>
        </div>
      </div>

      <!-- RIWAYAT TRANSAKSI -->
      <div id="page-history" class="d-none">
        <h6 class="fw-bold text-muted mb-3">RIWAYAT SCAN</h6>
        <div id="historyContent"></div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item-custom active" id="navHome" onclick="showPage('home', this, 'Menu Scanner')"><i class="fa-solid fa-qrcode"></i><span>Scanner</span></a>
      <a href="#" class="nav-item-custom" id="navHistory" onclick="showPage('history', this, 'Riwayat Scan')"><i class="fa-solid fa-clock-rotate-left"></i><span>Riwayat</span></a>
    </nav>
  </div>

  <!-- MODAL FORM & SCANNER BARCODE / QR CODE -->
  <div class="modal fade" id="scannerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-handle"></div>
        <div class="modal-body p-4 pt-0">
          <h4 class="fw-800 mb-1" style="font-weight: 800; letter-spacing: -0.5px; color: var(--dark-red);">SCANNER</h4>
          <p class="text-muted small mb-3">Arahkan kamera ke QR Code / Barcode.</p>
          
          <!-- AREA SCANNER CAMERA -->
          <div id="scannerSection" class="mb-3 d-none">
            <div id="reader"></div>
            <button class="btn btn-sm btn-secondary w-100 mt-2 rounded-pill" onclick="stopScanner()">Tutup Kamera Scanner</button>
          </div>

          <!-- FORM SCANNER -->
          <form id="scannerForm">
            <div class="mb-3">
              <label class="form-label fw-bold small">HASIL SCAN BARCODE / QR CODE</label>
              <div class="input-group">
                <input type="text" id="scanResult" class="form-control" placeholder="Hasil Scan" required readonly>
                <button class="btn btn-danger" type="button" onclick="startScanner()"><i class="fa-solid fa-qrcode me-1"></i> Scan</button>
              </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 rounded-pill py-3 fw-bold shadow-lg mb-2" 
                    style="background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%); border: none; font-size: 1.1rem;">
              SIMPAN
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let API_URL = "https://script.google.com/macros/s/AKfycbxmU7HK1ey_ap49ClTac_OPWKZ_u1IxWcBG6em7xHqcMRfAMeGgUai_ZaWsCg-Pvuj8/exec";

    let currentUser = null;
    let dbHistory = [];
    let html5QrcodeScanner = null;

    // --- API CALL HANDLER ---
    async function apiCall(action, payload = {}) {
      if (API_URL && API_URL.trim() !== "" && !API_URL.includes("AKfycbx...")) {
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, ...payload })
          });
          return await res.json();
        } catch (err) {
          console.error("API Call error:", err);
          return { success: false, message: "Gagal menghubungkan ke server." };
        }
      }

      // Offline / Mock Simulation Mode
      return new Promise((resolve) => {
        setTimeout(() => {
          if (action === 'loginUser') {
            if (payload.username === 'admin' && payload.password === 'admin') {
              resolve({ success: true, user: { username: 'admin', fullname: 'Admin' } });
            } else {
              resolve({ success: false, message: 'Username atau password salah!' });
            }
          } else if (action === 'saveInventory') {
            dbHistory.unshift({
              id: Date.now(),
              type: 'SCANNER',
              barcode: payload.barcode || 'QR-CODE',
              pic: payload.pic || 'admin',
              timestamp: new Date().toLocaleString('id-ID')
            });
            resolve({ success: true });
          } else if (action === 'getHistory') {
            resolve({ success: true, history: dbHistory });
          } else {
            resolve({ success: true });
          }
        }, 300);
      });
    }

    // --- OTENTIKASI ---
    async function handleLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (!u || !p) return Swal.fire('Oops', 'Lengkapi username dan password', 'warning');
      
      showLoader('OTENTIKASI...');
      const res = await apiCall('loginUser', { username: u, password: p });
      hideLoader();
      
      if (res.success) {
        currentUser = res.user;
        checkLoginState();
      } else {
        Swal.fire('Gagal Login', res.message || 'Kredensial salah', 'error');
      }
    }

    function checkLoginState() {
      if (currentUser) { 
        document.getElementById('loginPage').classList.add('d-none'); 
        document.getElementById('mainApp').classList.remove('d-none'); 
        updateUserUI();
        showPage('home', document.getElementById('navHome'), 'Menu Scanner'); 
      } else { 
        document.getElementById('loginPage').classList.remove('d-none'); 
        document.getElementById('mainApp').classList.add('d-none'); 
      }
    }

    function updateUserUI() {
      if (currentUser) {
        document.getElementById('userGreeting').innerText = `OPERATOR : ${currentUser.username.toUpperCase()}`;
      }
    }

    function logout() { currentUser = null; checkLoginState(); }

    // --- NAVIGASI ---
    function showPage(p, el, title) {
      if (title) document.getElementById('currentTitle').innerText = title;
      document.querySelectorAll('[id^="page-"]').forEach(pg => pg.classList.add('d-none'));
      document.getElementById('page-'+p).classList.remove('d-none');
      document.querySelectorAll('.nav-item-custom').forEach(n => n.classList.remove('active'));
      if (el) el.classList.add('active');
      if (p === 'history') loadHistory();
    }

    // --- SCANNER MODAL ---
    async function openScannerModal() {
      await stopScanner();
      const form = document.getElementById('scannerForm');
      form.reset();

      const modalEl = document.getElementById('scannerModal');
      const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
      modalInstance.show();
    }

    async function startScanner() {
      await stopScanner();
      document.getElementById('scannerSection').classList.remove('d-none');
      
      try {
        html5QrcodeScanner = new Html5Qrcode("reader");
        await html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async (decodedText) => {
            await stopScanner();
            document.getElementById('scanResult').value = decodedText;
            Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'QR/Barcode Terbaca!', showConfirmButton: false, timer: 1200 });
          },
          () => {}
        );
      } catch (err) {
        console.error("Scanner error:", err);
        const simulatedCode = 'SCAN-' + Math.floor(100000 + Math.random() * 900000);
        await stopScanner();
        document.getElementById('scanResult').value = simulatedCode;
        Swal.fire('Simulasi Scan', 'Berhasil mengisi data dummy: ' + simulatedCode, 'info');
      }
    }

    async function stopScanner() {
      if (html5QrcodeScanner) {
        try {
          await html5QrcodeScanner.stop();
          html5QrcodeScanner.clear();
        } catch (err) {
          // Ignore error jika sudah terhenti
        }
        html5QrcodeScanner = null;
      }
      const scannerSec = document.getElementById('scannerSection');
      if (scannerSec) scannerSec.classList.add('d-none');
    }

    // --- SUBMIT FORM SCANNER ---
    document.getElementById('scannerForm').onsubmit = async function(e) {
      e.preventDefault();
      await stopScanner();

      const barcodeVal = document.getElementById('scanResult').value.trim();
      if (!barcodeVal) {
        return Swal.fire('QR Kosong', 'Harap lakukan Scan QR Code/Barcode terlebih dahulu.', 'warning');
      }

      const payload = {
        type: 'SCANNER',
        barcode: barcodeVal,
        pic: currentUser ? currentUser.username : 'admin'
      };

      bootstrap.Modal.getInstance(document.getElementById('scannerModal')).hide();
      Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });

      const res = await apiCall('saveInventory', payload);
      if (res.success) {
        Swal.fire({ icon: 'success', title: 'Berhasil Disimpan', timer: 1500, showConfirmButton: false });
      } else {
        Swal.fire('Gagal Menyimpan', res.message || 'Terjadi kesalahan', 'error');
      }
    };

    // --- RIWAYAT SCAN ---
    async function loadHistory() {
      const res = await apiCall('getHistory');
      if (res.success) {
        const list = res.history || [];
        let html = '';
        list.forEach(item => {
          html += `
            <div class="card border-0 shadow-sm rounded-4 mb-3 p-3" style="background: white;">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-danger fw-bold" style="font-size:0.7rem">${item.type || 'SCANNER'}</span>
                <small class="text-muted fw-bold" style="font-size:0.7rem">${item.timestamp}</small>
              </div>
              <h6 class="fw-bold mb-1">${item.barcode}</h6>
              <div class="text-muted small">PIC: <b class="text-danger">${item.pic || '-'}</b></div>
            </div>`;
        });
        document.getElementById('historyContent').innerHTML = html || '<div class="text-center py-5 text-muted">Belum ada riwayat scan</div>';
      }
    }

    // --- UTILS ---
    function showLoader(m) { const l = document.getElementById('fullPageLoader'); if (l) { l.querySelector('p').innerText = m || 'LOADING...'; l.style.display = 'flex'; } }
    function hideLoader() { const l = document.getElementById('fullPageLoader'); if (l) l.style.display = 'none'; }

    document.addEventListener('DOMContentLoaded', () => {
      checkLoginState();

      const scannerModalEl = document.getElementById('scannerModal');
      if (scannerModalEl) {
        scannerModalEl.addEventListener('hidden.bs.modal', async () => {
          await stopScanner();
          const form = document.getElementById('scannerForm');
          if (form) form.reset();
        });
      }
    });
  </script>
</body>
</html>
