<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santafe Warehouse</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                            950: '#4c0519',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Latar belakang cerah, hangat dan sangat ringan tanpa filter berat */
            background: radial-gradient(circle at 50% 20%, #f43f5e 0%, #be123c 50%, #680b22 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sorotan Kuning Ringan di Belakang Logo Santa Fe (Tanpa filter blur berat) */
        .logo-spotlight {
            position: absolute;
            width: 280px;
            height: 140px;
            background: radial-gradient(ellipse at center, rgba(254, 240, 138, 0.35) 0%, rgba(251, 191, 36, 0.15) 50%, rgba(0,0,0,0) 80%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* Logo Emboss Bersinar Kuning Menyala Ringan (Performa Tinggi) */
        .logo-emboss-yellow {
            filter: drop-shadow(0 0 10px #fde047) drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.8));
            transition: transform 0.2s ease;
        }
        .logo-emboss-yellow:hover {
            transform: scale(1.03);
        }

        /* Kartu Ringan Performa Tinggi (Tanpa backdrop-filter & Tanpa animasi float melayang terus-menerus) */
        .card-lightweight {
            background: linear-gradient(135deg, rgba(175, 16, 55, 0.94) 0%, rgba(70, 5, 23, 0.96) 100%);
            border: 1px solid rgba(251, 113, 133, 0.4);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .card-lightweight::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #fde047, #f43f5e, #be123c);
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }

        .card-lightweight:hover {
            transform: translateY(-4px);
            border-color: rgba(250, 204, 21, 0.8);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(250, 204, 21, 0.3);
        }

        .card-lightweight:active {
            transform: translateY(0) scale(0.98);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Container Utama -->
    <div class="w-full max-w-md md:max-w-3xl lg:max-w-4xl z-10 my-auto flex flex-col items-center justify-center gap-6 md:gap-10 py-6">
        
        <!-- HEADER / LOGO 1 BLOCK WITH EMBOSSED YELLOW GLOW -->
        <div class="w-full flex justify-center py-2 relative">
            <!-- Spotlight Kuning di Belakang Logo Santa Fe -->
            <div class="logo-spotlight"></div>

            <div class="relative z-10 w-full max-w-[300px] sm:max-w-[380px] h-32 sm:h-40 flex items-center justify-center">
                <img 
                    src="https://muhardian.eu.org/whs/sf_logo.png" 
                    alt="Santa Fe Logo" 
                    class="max-h-full max-w-full object-contain logo-emboss-yellow cursor-pointer"
                    onerror="this.onerror=null; this.src='https://placehold.co/320x130/be123c/fde047?text=SANTA+FE+RELOCATION';"
                >
            </div>
        </div>

        <!-- MAIN BUTTONS / CARD SECTIONS -->
        <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8 px-2">
            
            <!-- LEFT COLUMN: STUFFING & REPORT -->
            <div class="flex flex-col gap-6 sm:gap-8">
                <!-- CARD 1: STUFFING -->
                <div 
                    id="btnStuffing" 
                    onclick="handleButtonClick('Stuffing', 'https://muhardian.eu.org/whs/staffing')" 
                    class="card-lightweight rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-between cursor-pointer group select-none min-h-[240px] sm:min-h-[280px]"
                >
                    <div class="w-full flex-1 flex items-center justify-center p-2 mb-4">
                        <img 
                            src="https://muhardian.eu.org/whs/logo_staffing1.png" 
                            alt="Logo Stuffing" 
                            class="max-h-28 sm:max-h-36 w-auto object-contain filter drop-shadow-[0_4px_6px_rgba(0,0,0,0.3)] group-hover:scale-105 transition-transform duration-200"
                            onerror="this.onerror=null; this.src='https://placehold.co/200x150/be123c/ffffff?text=STUFFING+LOGO';"
                        >
                    </div>
                    
                    <button class="w-full py-3.5 px-6 bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-600 text-white font-bold text-lg sm:text-xl rounded-xl shadow-md border border-red-400/40 tracking-wider flex items-center justify-center gap-3 transition-all duration-200">
                        <i class="fa-solid fa-boxes-packing text-amber-300"></i>
                        <span>STUFFING</span>
                    </button>
                </div>

                <!-- CARD 4: REPORT -->
                <div 
                    id="btnReport" 
                    onclick="handleButtonClick('Report', 'https://muhardian.eu.org/whs/report')" 
                    class="card-lightweight rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-between cursor-pointer group select-none min-h-[240px] sm:min-h-[280px]"
                >
                    <div class="w-full flex-1 flex items-center justify-center p-2 mb-4 overflow-hidden rounded-xl">
                        <img 
                            src="https://muhardian.eu.org/whs/report/report.jpg" 
                            alt="Logo Report" 
                            class="max-h-28 sm:max-h-36 w-auto object-contain rounded-xl filter drop-shadow-[0_4px_6px_rgba(0,0,0,0.3)] group-hover:scale-105 transition-transform duration-200"
                            onerror="this.onerror=null; this.src='https://placehold.co/200x150/be123c/ffffff?text=REPORT';"
                        >
                    </div>

                    <button class="w-full py-3.5 px-6 bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-600 text-white font-bold text-lg sm:text-xl rounded-xl shadow-md border border-red-400/40 tracking-wider flex items-center justify-center gap-3 transition-all duration-200">
                        <i class="fa-solid fa-chart-line text-amber-300"></i>
                        <span>REPORT</span>
                    </button>
                </div>
            </div>

            <!-- RIGHT COLUMN: ATTENDANCE & TEMP PROJECT -->
            <div class="flex flex-col gap-6 sm:gap-8">
                <!-- CARD 2: ATTENDANCE -->
                <div 
                    id="btnAttendance" 
                    onclick="handleButtonClick('Attendance', 'https://muhardian.eu.org/whs/att')" 
                    class="card-lightweight rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-between cursor-pointer group select-none min-h-[240px] sm:min-h-[280px]"
                >
                    <div class="w-full flex-1 flex items-center justify-center p-2 mb-4">
                        <img 
                            src="https://muhardian.eu.org/whs/logo_att.png" 
                            alt="Logo Attendance" 
                            class="max-h-28 sm:max-h-36 w-auto object-contain filter drop-shadow-[0_4px_6px_rgba(0,0,0,0.3)] group-hover:scale-105 transition-transform duration-200"
                            onerror="this.onerror=null; this.src='https://placehold.co/200x150/be123c/ffffff?text=ATTENDANCE+LOGO';"
                        >
                    </div>

                    <button class="w-full py-3.5 px-6 bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-600 text-white font-bold text-lg sm:text-xl rounded-xl shadow-md border border-red-400/40 tracking-wider flex items-center justify-center gap-3 transition-all duration-200">
                        <i class="fa-solid fa-clipboard-user text-amber-300"></i>
                        <span>ATTENDANCE</span>
                    </button>
                </div>

                <!-- CARD 3: TEMP PROJECT -->
                <div 
                    id="btnTempProject" 
                    onclick="handleButtonClick('Temp Project', 'https://muhardian.eu.org/whs/temp_project')" 
                    class="card-lightweight rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-between cursor-pointer group select-none min-h-[240px] sm:min-h-[280px]"
                >
                    <div class="w-full flex-1 flex items-center justify-center p-2 mb-4">
                        <img 
                            src="https://muhardian.eu.org/whs/temp.png" 
                            alt="Logo Temp Project" 
                            class="max-h-28 sm:max-h-36 w-auto object-contain filter drop-shadow-[0_4px_6px_rgba(0,0,0,0.3)] group-hover:scale-105 transition-transform duration-200"
                            onerror="this.onerror=null; this.src='https://placehold.co/200x150/be123c/ffffff?text=TEMP+PROJECT';"
                        >
                    </div>

                    <button class="w-full py-3.5 px-6 bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-600 text-white font-bold text-lg sm:text-xl rounded-xl shadow-md border border-red-400/40 tracking-wider flex items-center justify-center gap-3 transition-all duration-200">
                        <img 
                            src="https://muhardian.eu.org/whs/temp.png" 
                            alt="Icon Temp Project" 
                            class="w-7 h-7 object-contain filter drop-shadow group-hover:scale-105 transition-transform duration-200"
                            onerror="this.onerror=null; this.src='https://placehold.co/30x30/ffffff/be123c?text=TP';"
                        >
                        <span>TEMP PROJECT</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- FOOTER -->
    <footer class="text-center text-xs text-rose-200/90 mt-4">
        <a href="https://muhardian.eu.org" class="hover:text-amber-200 transition-colors duration-200 underline-offset-4 hover:underline flex items-center justify-center gap-1 font-medium tracking-wide">
            <span>&copy; 2026 Santafe Warehouse</span>
        </a>
    </footer>

</div>

<!-- AUDIO ELEMENTS -->
<!-- Menghapus atribut autoplay agar audio tidak terputar dua kali -->
<audio id="audioWelcome" preload="auto">
    <source src="https://muhardian.eu.org/whs/windows.wav" type="audio/wav">
</audio>

<audio id="audioNotice" preload="auto">
    <source src="https://muhardian.eu.org/whs/att_notice.wav" type="audio/wav">
</audio>

<script>
    const audioWelcome = document.getElementById('audioWelcome');
    const audioNotice = document.getElementById('audioNotice');

    // Memutar Suara Welcome Otomatis hanya 1x per sesi
    window.addEventListener('load', () => {
        if (!sessionStorage.getItem('welcomePlayed')) {
            setTimeout(() => {
                playWelcomeAudio();
            }, 3000);
        }
    });

    function playWelcomeAudio() {
        // Cek kembali agar dipastikan tidak diputar lebih dari sekali
        if (sessionStorage.getItem('welcomePlayed')) return;
        sessionStorage.setItem('welcomePlayed', 'true');

        audioWelcome.currentTime = 0;
        const playPromise = audioWelcome.play();

        if (playPromise !== undefined) {
            playPromise.then(() => {
                console.log("Audio welcome diputar secara otomatis (1x).");
            }).catch(error => {
                console.log("Autoplay audio disesuaikan kebijakan browser:", error);
            });
        }
    }

    // Memutar Suara saat Tombol Klik dan Redirect dalam 1 Halaman yang sama
    function handleButtonClick(type, url) {
        if (!audioWelcome.paused) {
            audioWelcome.pause();
        }

        audioNotice.currentTime = 0;
        audioNotice.play().catch(err => {
            console.log("Gagal memutar audio notice:", err);
        });

        console.log(`Tombol ${type} diklik! Menuju ke: ${url}`);

        if (url) {
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }
    }
</script>
</body>
</html>
