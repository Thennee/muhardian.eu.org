<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santafe Warehouse</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                            950: '#4c0519',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #881337 0%, #30030f 60%, #110005 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient Glow Effect */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(225,29,72,0.35) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9) translate(-10px, -10px); opacity: 0.6; }
            100% { transform: scale(1.2) translate(10px, 10px); opacity: 0.9; }
        }

        /* 3D Floating Animation */
        .float-3d {
            animation: floatAnim 4s ease-in-out infinite;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .float-3d-delayed {
            animation: floatAnim 4s ease-in-out infinite 2s;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        @keyframes floatAnim {
            0% {
                transform: translateY(0px) rotateX(0deg) rotateY(0deg);
                box-shadow: 0 15px 35px -5px rgba(225, 29, 72, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.5);
            }
            50% {
                transform: translateY(-12px) rotateX(4deg) rotateY(-2deg);
                box-shadow: 0 25px 45px 0px rgba(225, 29, 72, 0.45), 0 15px 15px -5px rgba(0, 0, 0, 0.6);
            }
            100% {
                transform: translateY(0px) rotateX(0deg) rotateY(0deg);
                box-shadow: 0 15px 35px -5px rgba(225, 29, 72, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.5);
            }
        }

        /* Card 3D Depth & Hover */
        .card-3d {
            background: linear-gradient(135deg, rgba(190, 18, 60, 0.35) 0%, rgba(76, 5, 25, 0.65) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 63, 94, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .card-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #f43f5e, #be123c, #fb7185);
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }

        .card-3d:hover {
            transform: translateY(-8px) scale(1.03) rotateX(6deg);
            border-color: rgba(244, 63, 94, 0.8);
            box-shadow: 0 20px 40px rgba(225, 29, 72, 0.5), 0 0 20px rgba(244, 63, 94, 0.4);
        }

        .card-3d:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Glossy Highlight */
        .shine {
            position: relative;
            overflow: hidden;
        }

        .shine::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 30%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 70%
            );
            transform: rotate(30deg);
            animation: shineAnim 5s infinite;
        }

        @keyframes shineAnim {
            0% { transform: translate(-100%, -100%) rotate(30deg); }
            20% { transform: translate(100%, 100%) rotate(30deg); }
            100% { transform: translate(100%, 100%) rotate(30deg); }
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <div class="ambient-glow top-10 left-10"></div>
    <div class="ambient-glow bottom-10 right-10"></div>

    <!-- Container Utama -->
    <div class="w-full max-w-md md:max-w-3xl lg:max-w-4xl z-10 my-auto flex flex-col items-center justify-center gap-6 md:gap-10 py-6">
        
        <!-- HEADER / LOGO 1 BLOCK -->
        <div class="w-full flex justify-center">
            <div class="w-full md:w-3/4 lg:w-2/3 card-3d shine rounded-2xl p-6 md:p-8 flex flex-col items-center justify-center shadow-2xl border border-red-500/30">
                <div class="relative w-full max-w-[280px] sm:max-w-[340px] h-28 sm:h-36 flex items-center justify-center">
                    <img 
                        src="https://muhardian.eu.org/whs/sf_logo.png" 
                        alt="Logo Utama" 
                        class="max-h-full max-w-full object-contain filter drop-shadow-[0_10px_15px_rgba(0,0,0,0.5)] transition-transform duration-300 hover:scale-105"
                        onerror="this.onerror=null; this.src='https://placehold.co/300x120/9f1239/ffffff?text=LOGO+1';"
                    >
                </div>
            </div>
        </div>

        <!-- MAIN BUTTONS / CARD SECTIONS (LOGO 2 & LOGO 3) -->
        <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8 px-2">
            
            <!-- CARD 1: STUFFING (Logo 2) -->
            <div 
                id="btnStuffing" 
                onclick="handleButtonClick('Stuffing')" 
                class="float-3d card-3d shine rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-between cursor-pointer group select-none min-h-[240px] sm:min-h-[280px]"
            >
                <div class="w-full flex-1 flex items-center justify-center p-2 mb-4">
                    <img 
                        src="https://muhardian.eu.org/whs/logo_staffing1.png" 
                        alt="Logo Stuffing" 
                        class="max-h-28 sm:max-h-36 w-auto object-contain filter drop-shadow-[0_8px_12px_rgba(0,0,0,0.4)] group-hover:scale-110 transition-transform duration-300"
                        onerror="this.onerror=null; this.src='https://placehold.co/200x150/be123c/ffffff?text=STUFFING+LOGO';"
                    >
                </div>
                
                <button class="w-full py-3.5 px-6 bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-600 text-white font-bold text-lg sm:text-xl rounded-xl shadow-lg border border-red-400/40 tracking-wider flex items-center justify-center gap-3 transition-all duration-300 group-hover:shadow-[0_0_20px_rgba(244,63,94,0.6)]">
                    <i class="fa-solid fa-boxes-packing text-rose-200"></i>
                    <span>STUFFING</span>
                </button>
            </div>

            <!-- CARD 2: ATTENDANCE (Logo 3) -->
            <div 
                id="btnAttendance" 
                onclick="handleButtonClick('Attendance', 'https://muhardian.eu.org/whs/att')" 
                class="float-3d-delayed card-3d shine rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-between cursor-pointer group select-none min-h-[240px] sm:min-h-[280px]"
            >
                <div class="w-full flex-1 flex items-center justify-center p-2 mb-4">
                    <img 
                        src="https://muhardian.eu.org/whs/logo_att.png" 
                        alt="Logo Attendance" 
                        class="max-h-28 sm:max-h-36 w-auto object-contain filter drop-shadow-[0_8px_12px_rgba(0,0,0,0.4)] group-hover:scale-110 transition-transform duration-300"
                        onerror="this.onerror=null; this.src='https://placehold.co/200x150/be123c/ffffff?text=ATTENDANCE+LOGO';"
                    >
                </div>

                <button class="w-full py-3.5 px-6 bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-600 text-white font-bold text-lg sm:text-xl rounded-xl shadow-lg border border-red-400/40 tracking-wider flex items-center justify-center gap-3 transition-all duration-300 group-hover:shadow-[0_0_20px_rgba(244,63,94,0.6)]">
                    <i class="fa-solid fa-clipboard-user text-rose-200"></i>
                    <span>ATTENDANCE</span>
                </button>
            </div>

        </div>

        <!-- FOOTER / COPYRIGHT LINK -->
        <footer class="text-center text-xs text-rose-300/80 mt-4">
            <a href="https://muhardian.eu.org" class="hover:text-rose-100 transition-colors duration-200 underline-offset-4 hover:underline flex items-center justify-center gap-1 font-medium tracking-wide">
                <span>&copy; 2026</span>
                        </a>
        </footer>

    </div>

    <!-- AUDIO ELEMENTS -->
    <audio id="audioWelcome" preload="auto" autoplay>
        <source src="https://muhardian.eu.org/whs/sayang.wav" type="audio/wav">
    </audio>

    <audio id="audioNotice" preload="auto">
        <source src="https://muhardian.eu.org/whs/att_notice.wav" type="audio/wav">
    </audio>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const audioWelcome = document.getElementById('audioWelcome');
        const audioNotice = document.getElementById('audioNotice');

        // Fungsi Memutar Suara Welcome Otomatis setelah 3 Detik tanpa perlu klik
        window.addEventListener('load', () => {
            setTimeout(() => {
                playWelcomeAudio();
            }, 3000);
        });

        function playWelcomeAudio() {
            audioWelcome.currentTime = 0;
            const playPromise = audioWelcome.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log("Audio welcome diputar secara otomatis.");
                }).catch(error => {
                    console.log("Autoplay audio:", error);
                });
            }
        }

        // Fungsi Memutar Suara saat Tombol Klik dan Redirect jika URL diberikan
        function handleButtonClick(type, url) {
            // Hentikan audio welcome jika sedang berjalan
            if (!audioWelcome.paused) {
                audioWelcome.pause();
            }

            // Putar audio notice
            audioNotice.currentTime = 0;
            audioNotice.play().catch(err => {
                console.log("Gagal memutar audio notice:", err);
            });

            console.log(`Tombol ${type} diklik!`);

            // Pindah halaman dengan jeda singkat agar suara notice terdengar lebih dulu
            if (url) {
                setTimeout(() => {
                    window.location.href = url;
                }, 300);
            }
        }
    </script>
</body>
</html>
